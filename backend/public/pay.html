<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to PhonePe — InstaHelp</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#5f259f">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/payment.css">
</head>
<body class="pay-page">

  <div id="testModeBanner" class="pay-test-banner" hidden>
    PhonePe Sandbox — test payments only
  </div>

  <div class="pay-status-page pay-enter" style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;">
    <div class="pay-loading-overlay show" id="loadingOverlay" style="position:relative;background:transparent;backdrop-filter:none;">
      <img src="image/phonepe-logo.svg" alt="PhonePe" class="pay-brand-logo" width="160" height="48">
      <div class="pay-spinner" aria-hidden="true"></div>
      <p class="pay-loading-text" id="statusText">Redirecting to PhonePe Secure Checkout…</p>
      <p class="pay-loading-sub" id="statusSub">Powered by PhonePe Payment Gateway</p>
    </div>

    <div id="payAlert" class="pay-alert error" role="alert" style="max-width:420px;margin:24px auto 0;"></div>

    <div class="pay-status-actions" id="errorActions" hidden style="margin-top:24px;">
      <a href="index.html" class="pay-btn pay-btn-outline">Back To Home</a>
      <button type="button" class="pay-btn pay-btn-purple" id="retryBtn">Try Again</button>
    </div>
  </div>

  <script src="js/runtime-bootstrap.js?v=3"></script>
  <script src="js/payment-config.js?v=3"></script>
  <script src="js/api.js?v=3"></script>
  <script src="js/phonepe.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/transactions.js"></script>
  <script src="js/payment.js"></script>
  <script>
  (function () {
    'use strict';

    var statusText = document.getElementById('statusText');
    var statusSub = document.getElementById('statusSub');
    var payAlert = document.getElementById('payAlert');
    var errorActions = document.getElementById('errorActions');
    var loadingOverlay = document.getElementById('loadingOverlay');
    var started = false;

    function showError(msg) {
      loadingOverlay.classList.remove('show');
      payAlert.textContent = msg;
      payAlert.className = 'pay-alert show error';
      errorActions.hidden = false;
    }

    function startCheckout() {
      if (started || InstaHelpPayment.isPayLocked()) return;
      started = true;

      var settings = InstaHelpPaymentConfig.getSettings();
      var pp = settings.phonepe || {};
      var useApi = settings.apiMode === 'backend' || pp.apiMode === 'pg_api';

      if (pp.environment === 'sandbox' || (useApi && settings.apiBaseUrl)) {
        document.getElementById('testModeBanner').hidden = !(pp.environment === 'sandbox');
      }

      if (!settings.paymentsEnabled || !pp.enabled) {
        showError('Payments are temporarily unavailable. Please contact support.');
        return;
      }

      if (useApi) {
        statusText.textContent = 'Connecting to PhonePe Payment Gateway…';
        statusSub.textContent = 'You will be redirected to PhonePe\'s secure checkout page';
      } else {
        statusText.textContent = 'Redirecting to PhonePe…';
      }

      var order = InstaHelpPayment.resolveOrderInput();
      var totals = InstaHelpPayment.calculateTotals(order);
      var errors = InstaHelpPayment.validateOrder(order, totals);
      if (errors.length) {
        showError(errors.join(' '));
        started = false;
        return;
      }

      var result = InstaHelpPayment.processPayment(order, { redirectDelay: useApi ? 400 : 800 });

      function onResult(res) {
        if (!res || !res.ok) {
          started = false;
          showError((res && res.error) || (res && res.errors && res.errors.join(' ')) || 'Could not start PhonePe checkout.');
          InstaHelpPayment.clearPayLock();
        }
      }

      if (result && typeof result.then === 'function') {
        result.then(onResult);
      } else {
        onResult(result);
      }
    }

    document.getElementById('retryBtn').addEventListener('click', function () {
      payAlert.className = 'pay-alert';
      errorActions.hidden = true;
      loadingOverlay.classList.add('show');
      started = false;
      InstaHelpPayment.clearPayLock();
      startCheckout();
    });

    document.addEventListener('DOMContentLoaded', startCheckout);
  })();
  </script>
</body>
</html>
