# Netlify build settings - connect this repo and deploy from main branch.
# Site settings → Build & deploy → Link repository → Instahelp.in

[build]
  publish = "."

# Proxy API calls to Render backend (avoids CORS "failed to fetch" on Netlify).
# Change the URL below if your primary backend is on Railway instead.
[[redirects]]
  from = "/api/*"
  to = "https://instahelp-in.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://instahelp-in.onrender.com/health"
  status = 200
  force = true

[[redirects]]
  from = "/health/live"
  to = "https://instahelp-in.onrender.com/health/live"
  status = 200
  force = true

[[redirects]]
  from = "https://www.instahelp.in/*"
  to = "https://instahelp.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://instahelp.in/*"
  to = "https://instahelp.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.instahelp.in/*"
  to = "https://instahelp.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/app-waitlist"
  to = "/app-waitlist.html"
  status = 200

[[redirects]]
  from = "/plans"
  to = "/plans.html"
  status = 200

[[redirects]]
  from = "/giftcards"
  to = "/giftcards.html"
  status = 200

[[redirects]]
  from = "/shop"
  to = "/shop.html"
  status = 200

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
