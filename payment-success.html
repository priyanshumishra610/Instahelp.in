<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful — InstaHelp</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/payment.css">
  <script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body class="pay-page">

  <div class="pay-status-page pay-enter">
    <div class="pay-status-icon-wrap">
      <div class="pay-status-circle success" aria-hidden="true">
        <svg class="pay-checkmark" viewBox="0 0 52 52" aria-hidden="true">
          <path d="M14 27 L22 35 L38 17"/>
        </svg>
      </div>
    </div>

    <h1>Payment Successful</h1>
    <p class="pay-status-sub">Transaction completed · Thank you for choosing InstaHelp</p>

    <div class="pay-status-details" id="successDetails">
      <div class="pay-status-row">
        <span>Order Number</span>
        <span id="orderId">—</span>
      </div>
      <div class="pay-status-row">
        <span>Transaction ID</span>
        <span id="transactionId">—</span>
      </div>
      <div class="pay-status-row">
        <span>Date</span>
        <span id="paymentDate">—</span>
      </div>
      <div class="pay-status-row">
        <span>Amount Paid</span>
        <span id="paymentAmount">—</span>
      </div>
      <div class="pay-status-row">
        <span>Service</span>
        <span id="paymentService">—</span>
      </div>
    </div>

    <div class="pay-status-actions">
      <a href="orders.html" class="pay-btn pay-btn-primary">
        <i data-lucide="package" style="width:18px;height:18px;"></i>
        View Orders
      </a>
      <a href="index.html" class="pay-btn pay-btn-outline">
        <i data-lucide="home" style="width:18px;height:18px;"></i>
        Back To Home
      </a>
    </div>
  </div>

  <script src="js/payment-config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/transactions.js"></script>
  <script src="js/payment.js"></script>
  <script>
  (function () {
    'use strict';

    function formatDate(iso) {
      if (!iso) return '—';
      try {
        return new Date(iso).toLocaleString('en-IN', {
          day: 'numeric', month: 'short', year: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });
      } catch (e) { return iso; }
    }

    document.addEventListener('DOMContentLoaded', function () {
      if (window.lucide) lucide.createIcons();

      var params = new URLSearchParams(window.location.search);
      var pending = InstaHelpPayment.getPendingTransaction();

      var settings = InstaHelpPaymentConfig.getSettings();
      var useApi = settings.apiMode === 'backend' || (settings.phonepe && settings.phonepe.apiMode === 'pg_api');

      if (useApi && pending && pending.backendOrderId && InstaHelpAPI) {
        if (settings.apiBaseUrl) InstaHelpAPI.setApiBase(settings.apiBaseUrl);
        InstaHelpAPI.verifyPayment({ orderId: pending.backendOrderId }).catch(function () {});
      } else if (pending) {
        InstaHelpPayment.markPaymentSuccess();
      }

      var orderId = params.get('orderId') || (pending && pending.orderId) || '—';
      var txId = params.get('txn') || (pending && pending.transactionId) || '—';
      var amount = params.get('amount') || (pending && pending.amount);
      var date = pending && pending.date;
      var service = params.get('service') || (pending && pending.serviceName) || '—';

      /* Fallback: latest successful transaction */
      if (orderId === '—') {
        var txs = InstaHelpTransactions.getAllTransactions();
        var latest = txs.find(function (t) { return t.status === 'success'; }) || txs[0];
        if (latest) {
          orderId = latest.orderId;
          txId = latest.transactionId;
          amount = latest.amount;
          date = latest.date;
          service = latest.service;
        }
      }

      document.getElementById('orderId').textContent = orderId;
      document.getElementById('transactionId').textContent = txId;
      document.getElementById('paymentDate').textContent = formatDate(date);
      document.getElementById('paymentAmount').textContent = amount
        ? InstaHelpPayment.formatINR(amount) : '—';
      document.getElementById('paymentService').textContent = service;
    });
  })();
  </script>
</body>
</html>
