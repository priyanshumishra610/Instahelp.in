<!--
  ═══ DOODLE THEME — paste into any HTML page ═══
  Copy the whole "doodle" folder into your project first.
  Adjust the href/src paths to match where you put the folder.
-->

<!-- 1. In <head> (after your main stylesheet, if any) -->
<link rel="stylesheet" href="doodle/css/doodle.css">

<!-- 2. On <body> — add class, keep your existing classes -->
<!-- <body class="doodle-page"> -->
<!-- e.g. <body class="my-page doodle-page"> -->

<!-- 3. Before </body> — injects stars & strings -->
<script src="doodle/js/doodle.js" defer></script>
